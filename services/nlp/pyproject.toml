[project]
name = "silsilah-nlp"
version = "0.1.0"
description = "Layanan NLP Silsilah: anonimisasi, OCR, embedding, penempatan pohon."
authors = [{ name = "Vassel Goleyu" }]
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
ner = ["transformers>=4.45", "torch>=2.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silsilah"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM905"]  # daftar kata ditulis sebagai "a b c".split() agar mudah dibaca

[tool.ruff.lint.per-file-ignores]
# karakter mirip-ASCII (digit fullwidth, en dash) disengaja: itulah yang dideteksi/diuji
"src/silsilah/anonymizer/*" = ["RUF001"]
"tests/anonymizer/*" = ["RUF001", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
